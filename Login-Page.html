<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dazzling Gown - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="brand-side">
            <img src="Dazzle-Logo.png" alt="Dazzling Gown Logo" class="brand-logo">
        </div>

        <div class="form-card" style="width: 350px;">
            <form action="Dashboard.html">
                <div class="input-group">
                    <label>Username:</label>
                    <input type="text" required>
                </div>
                <div class="input-group">
                    <label>Password:</label>
                    <input type="password" required>
                </div>

                <button type="submit" class="submit-btn">Submit</button>

                <div style="font-size: 12px; margin-top: 10px; text-align: center;">
                    <label><input type="checkbox"> Remember Me</label>
                </div>

                <p class="link-text" style="text-align: center;">
                    Don't have an account? <a href="Register-Page.html">(Register)</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
