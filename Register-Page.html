<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dazzling Gown - Register</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <form action="Login-Page.html">
                <div class="input-group"><label>First name:</label><input type="text" required></div>
                <div class="input-group"><label>Surname:</label><input type="text" required></div>
                <div class="input-group"><label>Address:</label><input type="text" required></div>
                <div class="input-group"><label>Contact No.:</label><input type="tel" required></div>
                <div class="input-group"><label>Email Address:</label><input type="email" required></div>
                <div class="input-group"><label>Password:</label><input type="password" required></div>
                <div class="input-group"><label>Confirm Password:</label><input type="password" required></div>

                <p style="font-size: 14px;">Gender:</p>
                <div class="radio-group">
                    <label><input type="radio" name="gender" required> Male</label>
                    <label><input type="radio" name="gender" required> Female</label>
                    <label><input type="radio" name="gender" required> Others</label>
                </div>

                <div style="font-size: 12px; margin-top: 10px;">
                    <label>
                        <input type="checkbox" id="termsCheckbox" required> Terms and Conditions 
                        <a href="Terms-Condition.html" style="font-size: 12px; margin-left: 5px;">(Read)</a>
                    </label>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>

        <div class="brand-side">
            <h1 style="font-style: cursive;">Dazzling Gown</h1>
            <p class="link-text">Already have an account? <a href="Login-Page.html">(Login)</a></p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            // Looks for ?accepted=true in the URL
            if (urlParams.get('accepted') === 'true') {
                const checkbox = document.getElementById('termsCheckbox');
                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        };
    </script>
</body>
</html>
